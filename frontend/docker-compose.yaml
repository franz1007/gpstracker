services:
  npm:
    environment:
      - NPM_CONFIG_CACHE=/app/.npm-cache-docker/
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    entrypoint: ["npm"]
    volumes:
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./node_modules:/app/node_modules
      - ./:/app
