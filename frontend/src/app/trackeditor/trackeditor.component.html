<div class="container">
  <div>
    <label>
      Category
    </label>
    <p-select [options]="categories" appendTo="body" [ngModel]="track.value()?.category" (onChange)="onCategoryChange($event.value)" />
  </div>
  <div>
    <label>
      Group
    </label>
    <p-select [options]="groupNames()" appendTo="body" [ngModel]="track.value()?.group?.name" (onChange)="onGroupChange($event.value)" />
  </div>
  <div>
    <label for="new-group" style="margin-right: 10px">Create Group</label>
    <input id="new-group" type="text" pInputText [(ngModel)]="newGroupName" placeholder="New Group Name" style="margin-right: 10px;"/>
    <p-button label="Create" severity="secondary" (onClick)="onGroupCreate()"/>
  </div>
  <app-map id="map" [showTrackMode]="mapTrack()" zoomKey="editor"></app-map>
</div>
